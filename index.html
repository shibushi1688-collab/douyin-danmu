<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>纤型公屏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

.titlebar {
  display: flex;
  align-items: center;
  padding: 4px 8px;
  background: rgba(0,0,0,var(--bg-alpha));
  border-radius: 8px 8px 0 0;
  cursor: move;
  -webkit-app-region: drag;
}
.titlebar .title { font-size: 12px; color: rgba(255,255,255,0.7); flex: 1; }
.titlebar .conn-step { font-size: 11px; color: rgba(255,200,100,0.9); margin-left: 8px; flex: 1; }
.titlebar .win-btn {
  -webkit-app-region: no-drag;
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  font-size: 14px;
  cursor: pointer;
  padding: 2px 6px;
  line-height: 1;
}
.titlebar .win-btn:hover { color: #fff; }
.titlebar .win-btn.close:hover { background: #e81123; border-radius: 4px; }

.controls {
  background: rgba(0,0,0,var(--bg-alpha));
  padding: 5px 8px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.ctrl-input {
  flex: 1;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 12px;
  outline: none;
  -webkit-app-region: no-drag;
}
.ctrl-input::placeholder { color: rgba(255,255,255,0.3); }
.ctrl-input:focus { border-color: rgba(255,71,87,0.6); }
.btn {
  background: rgba(255,71,87,0.85);
  color: #fff;
  border: none;
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  -webkit-app-region: no-drag;
}
.btn:hover { background: rgba(255,71,87,1); }
.btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; }
.btn.disconnect { background: rgba(255,255,255,0.15); }
.btn.disconnect:hover { background: rgba(255,255,255,0.25); }

.slider-row {
  background: rgba(0,0,0,var(--bg-alpha));
  padding: 4px 8px 5px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.slider-label { font-size: 11px; color: rgba(255,255,255,0.4); white-space: nowrap; }
.slider {
  -webkit-appearance: none;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.15);
  outline: none;
  cursor: pointer;
  -webkit-app-region: no-drag;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #ff4757;
  cursor: pointer;
}
.slider-val { font-size: 11px; color: rgba(255,255,255,0.5); width: 30px; text-align: right; }

/* 顶部通知栏 */
.event-bar {
  background: rgba(0,0,0,var(--bg-alpha));
  padding: 4px 8px;
  color: rgba(255,255,255,0.5);
  min-height: 20px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.event-bar .event-item {
  animation: fadeIn 0.2s ease;
}
.event-bar .event-item.member { color: #7ec8ff; }
.event-bar .event-item.gift { color: #ffd700; }
.event-bar .event-item.like { color: #ff6b81; }
.event-bar .event-item.social { color: #7bed9f; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.danmu-list {
  flex: 1;
  overflow-y: auto;
  background: rgba(0,0,0,var(--bg-alpha));
  border-radius: 0 0 8px 8px;
  padding: 6px 8px;
}
.danmu-list::-webkit-scrollbar { width: 3px; }
.danmu-list::-webkit-scrollbar-track { background: transparent; }
.danmu-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

.danmu-item {
  padding: 4px 6px;
  margin-bottom: 3px;
  border-radius: 4px;
  background: rgba(0,0,0,var(--bg-alpha));
  border-left: 2px solid #ff4757;
  word-break: break-all;
  animation: slideIn 0.15s ease;
}

.danmu-user { font-weight: 600; margin-right: 4px; }
.danmu-text { color: rgba(255,255,255,0.9); }
.empty-tip { text-align: center; color: rgba(255,255,255,0.2); padding: 20px 0; font-size: 12px; }

@keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;--bg-alpha:0.5">

<div class="titlebar">
  <span class="title">纤型公屏</span>
  <span class="conn-step" id="connStep"></span>
  <div style="display:flex;gap:2px;-webkit-app-region:no-drag">
    <span id="statusDot" style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);align-self:center;margin-right:4px"></span>
    <button class="win-btn close" onclick="window.electronAPI.closeWindow()">✕</button>
  </div>
</div>

<div class="controls">
  <input type="text" class="ctrl-input" id="roomUrl" placeholder="粘贴直播间链接或房间号" />
  <button class="btn" id="btnConnect" onclick="toggleConnect()">连接</button>
</div>

<div class="slider-row">
  <span class="slider-label">背景</span>
  <input type="range" class="slider" id="bgSlider" min="5" max="80" value="50"
    style="width:80px" oninput="setBgAlpha(this.value)" />
  <span class="slider-val" id="bgVal">50%</span>
  <span class="slider-label" style="margin-left:6px">字</span>
  <input type="range" class="slider" id="fontSlider" min="10" max="60" value="13"
    style="width:80px" oninput="setFontSize(this.value)" />
  <span class="slider-val" id="fontVal">13</span>
</div>

<div class="event-bar" id="eventBar"></div>

<div class="danmu-list" id="danmuList">
  <div class="empty-tip">等待弹幕...</div>
</div>

<script src="renderer.js"></script>
</body>
</html>
