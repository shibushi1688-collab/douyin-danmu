<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>抖音弹幕</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

.titlebar {
  display: flex;
  align-items: center;
  padding: 4px 8px;
  background: rgba(0,0,0,0.45);
  border-radius: 8px 8px 0 0;
  cursor: move;
  -webkit-app-region: drag;
}
.titlebar .title { font-size: 12px; color: rgba(255,255,255,0.7); flex: 1; }
.titlebar .conn-step { font-size: 11px; color: rgba(255,200,100,0.8); margin-left: 8px; flex: 1; }
.titlebar .win-btn {
  -webkit-app-region: no-drag;
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  font-size: 14px;
  cursor: pointer;
  padding: 2px 6px;
  line-height: 1;
}
.titlebar .win-btn:hover { color: #fff; }
.titlebar .win-btn.close:hover { background: #e81123; border-radius: 4px; }

.controls {
  background: rgba(0,0,0,0.35);
  padding: 6px 8px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.ctrl-input {
  flex: 1;
  padding: 5px 8px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.08);
  color: #fff;
  font-size: 12px;
  outline: none;
  -webkit-app-region: no-drag;
}
.ctrl-input::placeholder { color: rgba(255,255,255,0.3); }
.ctrl-input:focus { border-color: rgba(255,71,87,0.6); }
.btn {
  background: rgba(255,71,87,0.8);
  color: #fff;
  border: none;
  padding: 5px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  -webkit-app-region: no-drag;
}
.btn:hover { background: rgba(255,71,87,1); }
.btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; }

.slider-row {
  background: rgba(0,0,0,0.35);
  padding: 4px 8px 5px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.slider-label { font-size: 11px; color: rgba(255,255,255,0.4); white-space: nowrap; }
.slider {
  flex: 1;
  -webkit-appearance: none;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.15);
  outline: none;
  cursor: pointer;
  -webkit-app-region: no-drag;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ff4757;
  cursor: pointer;
}
.slider-val { font-size: 11px; color: rgba(255,255,255,0.5); width: 30px; text-align: right; }
.slider-row .btn {
  padding: 3px 8px;
  font-size: 11px;
  background: rgba(255,255,255,0.1);
}
.slider-row .btn:hover { background: rgba(255,255,255,0.2); }

.danmu-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 6px;
  background: transparent;
}
.danmu-list::-webkit-scrollbar { display: none; }

.danmu-item {
  padding: 4px 6px;
  margin-bottom: 2px;
  border-radius: 4px;
  font-size: 13px;
  animation: slideIn 0.15s ease;
  background: rgba(0,0,0,0.5);
  border-left: 2px solid #ff4757;
  word-break: break-all;
  line-height: 1.4;
}
.danmu-item.member { border-left-color: #70a1ff; }
.danmu-item.gift { border-left-color: #ffa502; }
.danmu-item.like { border-left-color: #ff6b81; }
.danmu-item.social { border-left-color: #2ed573; }
.danmu-item.share { border-left-color: #7bed9f; }

.danmu-user { color: #ff4757; font-weight: 600; margin-right: 4px; }
.danmu-text { color: rgba(255,255,255,0.9); }
.danmu-time { color: rgba(255,255,255,0.3); font-size: 10px; margin-left: 4px; }
.empty { text-align: center; color: rgba(255,255,255,0.2); padding: 20px 0; font-size: 12px; }

@keyframes slideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="titlebar">
  <span class="title">抖音弹幕</span>
  <span class="conn-step" id="connStep"></span>
  <div style="display:flex;gap:2px;-webkit-app-region:no-drag">
    <span class="status-dot" id="statusDot" style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);align-self:center;margin-right:4px"></span>
    <button class="win-btn close" onclick="window.electronAPI.closeWindow()">✕</button>
  </div>
</div>

<div class="controls">
  <input type="text" class="ctrl-input" id="roomUrl" placeholder="粘贴直播间链接或房间号" />
  <button class="btn" id="btnConnect" onclick="connectRoom()">连接</button>
</div>

<div class="slider-row">
  <span class="slider-label">透明</span>
  <input type="range" class="slider" id="opacitySlider" min="10" max="100" value="80"
    oninput="setOpacity(this.value)" />
  <span class="slider-val" id="opacityVal">80%</span>
  <span class="slider-label" style="margin-left:4px">字</span>
  <input type="range" class="slider" id="fontSlider" min="11" max="24" value="13"
    style="flex:0.7" oninput="setFontSize(this.value)" />
  <span class="slider-val" id="fontVal">13</span>
  <span class="slider-label" style="margin-left:4px">大小</span>
  <input type="range" class="slider" id="zoomSlider" min="50" max="100" value="100"
    style="flex:0.7" oninput="setZoom(this.value)" />
  <span class="slider-val" id="zoomVal">100%</span>
  <button class="btn" style="margin-left:2px" onclick="clearDanmu()">清空</button>
</div>

<div class="danmu-list" id="danmuList">
  <div class="empty">等待弹幕...</div>
</div>

<script src="renderer.js"></script>
</body>
</html>
